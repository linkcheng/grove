[project]
name = "grove"
version = "0.1.0"
description = "GROVE WS-0 reproducible runtime build baseline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres==3.1.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-ai-slim>=2.22,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2,<3",
  "structlog>=26.1,<27",
  "uvicorn[standard]>=0.34,<1",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp>=1.28,<2",
  "cryptography>=46,<47",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.grove.capabilities]
dbos = "disabled"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
markers = [
  "integration: requires the real PostgreSQL service provided by compose",
]
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S104", "UP046", "UP047"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts", "tests"]
plugins = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
