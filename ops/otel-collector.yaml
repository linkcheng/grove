{
  "receivers": {
    "otlp": {"protocols": {"grpc": {"endpoint": "0.0.0.0:4317"}, "http": {"endpoint": "0.0.0.0:4318"}}}
  },
  "processors": {
    "memory_limiter": {"check_interval": "1s", "limit_mib": 256, "spike_limit_mib": 64},
    "attributes/redact": {
      "actions": [
        {"key": "tenant_id", "action": "delete"},
        {"key": "principal_id", "action": "delete"},
        {"key": "run_id", "action": "delete"},
        {"key": "command_id", "action": "delete"},
        {"key": "execution_fence", "action": "delete"},
        {"key": "authorization", "action": "delete"},
        {"key": "baggage", "action": "delete"},
        {"key": "payload", "action": "delete"},
        {"key": "prompt", "action": "delete"},
        {"key": "provider_response", "action": "delete"}
      ]
    },
    "batch": {"send_batch_size": 512, "send_batch_max_size": 512, "timeout": "2s"}
  },
  "exporters": {
    "otlphttp/backend": {
      "endpoint": "${env:OTEL_BACKEND_ENDPOINT}",
      "timeout": "5s",
      "sending_queue": {"enabled": true, "num_consumers": 2, "queue_size": 2048},
      "retry_on_failure": {"enabled": true, "initial_interval": "1s", "max_interval": "5s", "max_elapsed_time": "30s"}
    }
  },
  "service": {
    "telemetry": {"logs": {"level": "info"}},
    "pipelines": {
      "traces": {"receivers": ["otlp"], "processors": ["memory_limiter", "attributes/redact", "batch"], "exporters": ["otlphttp/backend"]},
      "metrics": {"receivers": ["otlp"], "processors": ["memory_limiter", "attributes/redact", "batch"], "exporters": ["otlphttp/backend"]}
    }
  }
}
